# dsh-context-compass 发布工作流（人工审批门）
#
# 安全模型：
# - 触发 = 本机人工创建的 tag（context-compass-vX.Y.Z），发布决策永远是人的决定
# - 权限最小化：workflow 仅 contents: read；NPM_TOKEN 只注入 publish 步骤的 env
# - token = npm granular access token（仅授权 dsh-context-compass 包），存 GitHub secrets
# - 审批门：environment `npm-publish` + required reviewers
# - 版本一致性守卫：tag 版本必须与 package.json version 完全一致
# - actions 按 SHA 固定
name: publish

on:
  push:
    tags:
      - 'context-compass-v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 'Guard: tag version matches package.json'
        run: |
          EXPECTED="refs/tags/context-compass-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::tag/version mismatch: $GITHUB_REF vs $EXPECTED"
            exit 1
          fi
      - name: Install
        run: npm ci --legacy-peer-deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Verify (build + typecheck + smoke + mount + client-mount)
        run: |
          npm run build
          npm run typecheck
          npm run smoke
          npm run mount
          node scripts/client-mount.mjs
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "canary prerelease $VERSION → dist-tag next"
            npm publish --access public --tag next
          else
            echo "stable $VERSION → dist-tag latest"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}